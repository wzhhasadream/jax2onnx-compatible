[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "jax2onnx"
version = "0.8.1.post1"
description = "jax2onnx compatibility build for JAX 0.6.0 and Flax 0.10.7"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "enpasos", email = "matthias.unverzagt@enpasos.ai" }]
maintainers = [{ name = "wzhhasadream" }]
dependencies = [
    "jax==0.6.0",
    "flax==0.10.7",
    "onnx>=1.17.0,<1.19.0",
    "onnxruntime>=1.22.0",
    "ml_dtypes==0.5.1",
    "optax>=0.2.4",
    "orbax-checkpoint>=0.11.6",
    "orbax-export>=0.0.6",
    "einops>=0.8.1,<0.9.0",
    "equinox>=0.12.2",
    "netron>=8.2.9",
]

[project.urls]
Repository = "https://github.com/wzhhasadream/jax2onnx-compatible"
Source = "https://github.com/enpasos/jax2onnx"

[tool.setuptools.packages.find]
include = ["jax2onnx*"]

[tool.setuptools.package-data]
jax2onnx = ["**/*.json", "**/*.yaml", "**/*.yml"]
